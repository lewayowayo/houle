     <div class="m" style="background:var(--surf)"><div class="v" style="color:var(--accent)">${nf(c.target)}</div><div class="l">kcal pour<br>perdre doucement</div></div>
     <div class="m" style="background:var(--surf)"><div class="v">${c.prot} g</div><div class="l">protéines<br>par jour</div></div></div></div>
   <p class="note mt">Calcul pour ${nf(c.w,1)} kg (moyenne de tes dernières pesées) : métabolisme de repos de ${nf(c.bmr)} kcal (formule de Mifflin-St Jeor) multiplié par ton activité, moins un petit déficit de 300 kcal au maximum. C'est une estimation à 10 % près : ta tendance des semaines suivantes donne la vraie réponse.</p>
   ${trend?`<div class="banner ok" style="margin:10px 0 0">${trend}</div>`:`<p class="note mt">Avec 3 pesées sur au moins 2 semaines, l'appli te dira si le rythme est bon.</p>`}`
   :`<p class="note">Entre ta taille, ton âge et une pesée (plus haut) pour calculer ton budget.</p>`}
   <details class="acc" style="margin-top:6px"><summary>Comment s'en servir sans tout peser</summary><p>
   <b>Pas de régime strict.</b> Avec Hashimoto et la reprise de la force, un gros déficit fatigue, coûte du muscle et ralentit la dépense. 300 kcal de moins par jour, c'est une tartine beurrée et un verre de vin : ça ne se sent presque pas, et ça fait environ 1,5 kg de gras en un mois.<br><br>
   <b>Calibrer l'œil :</b> une à deux semaines avec une appli de comptage, puis on lâche. Ensuite l'assiette suffit : la moitié en légumes, une paume de protéines, un poing de féculents, un filet d'huile.<br><br>
   <b>Les protéines d'abord</b> : 25 à 30 g par repas (3 œufs, un skyr, 100 g de poisson ou de poulet, 150 g de tofu, une grosse assiette de lentilles). Elles protègent le muscle et calent.<br><br>
   <b>Autour des séances</b> : garde les féculents au repas d'avant ou d'après. Ils servent à la séance, pas au ventre.<br><br>
   <b>Les tournées</b> : prévois une collation protéinée dans la voiture (skyr, amandes, œuf dur) pour éviter d'arriver affamée au dîner.<br><br>
   <b>L'alcool</b> : un verre, c'est 100 à 150 kcal, et il abîme le sommeil, qui règle la faim du lendemain.</p></details></div>`;
}

// ----- BILANS -----
// norm : norme de labo par défaut ; chaque bilan peut porter sa propre norme (les réactifs changent)
const BIO=[
  {k:'tsh',n:'TSH',u:'mUI/L',norm:[0.55,4.78],dec:2},
  {k:'t4',n:'T4 libre',u:'pmol/L',norm:[11.5,22.7],dec:1},
  {k:'t3',n:'T3 libre',u:'pmol/L',norm:[3.5,6.5],dec:1},
  {k:'fer',n:'Ferritine',u:'µg/L',norm:null,dec:0},
  {k:'vitd',n:'Vitamine D',u:'ng/mL',norm:[30,60],dec:1},
  {k:'tpo',n:'Anti-TPO',u:'UI/mL',norm:null,dec:0,noChart:true}
];
const bioNorm=(x,b)=>(x.norms&&x.norms[b.k])||b.norm;
function bioChart(b){
  const pts=[...data.thyro].filter(x=>x[b.k]!=null).sort((a,c)=>a.date<c.date?-1:1);
  if(pts.length<2)return `<p class="note">${pts.length?'Une seule valeur pour l\'instant.':'Aucune valeur.'}</p>`;
  const W=320,H=140,P=30,norm=bioNorm(pts[pts.length-1],b);
  const xs=pts.map(p=>parseK(p.date).getTime()),ys=pts.map(p=>p[b.k]);
  let y0=Math.min(...ys),y1=Math.max(...ys);if(norm){y0=Math.min(y0,norm[0]);y1=Math.max(y1,norm[1]);}
  const pad=(y1-y0)*.12||1;y0-=pad;y1+=pad;
  const x0=xs[0],x1=xs[xs.length-1];
  const X=x=>P+(x-x0)/(x1-x0||1)*(W-P-12),Y=y=>8+(y1-y)/(y1-y0)*(H-32);
  const band=norm?`<rect x="${P}" y="${Y(norm[1]).toFixed(1)}" width="${W-P-12}" height="${(Y(norm[0])-Y(norm[1])).toFixed(1)}" fill="var(--ok)" opacity=".12" rx="4"/><text x="2" y="${(Y(norm[1])+4).toFixed(1)}" font-size="10" fill="var(--text3)">${nf(norm[1],b.dec>1?2:1)}</text><text x="2" y="${(Y(norm[0])+4).toFixed(1)}" font-size="10" fill="var(--text3)">${nf(norm[0],b.dec>1?2:1)}</text>`:'';
  const path=pts.map((p,i)=>(i?'L':'M')+X(xs[i]).toFixed(1)+','+Y(p[b.k]).toFixed(1)).join('');
  const dots=pts.map((p,i)=>{const n=bioNorm(p,b),out=n&&(p[b.k]<n[0]||p[b.k]>n[1]);return `<circle cx="${X(xs[i]).toFixed(1)}" cy="${Y(p[b.k]).toFixed(1)}" r="${out?4.5:3.5}" fill="${out?'var(--warn)':'var(--c-surf)'}"/>`}).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${band}<path d="${path}" fill="none" stroke="var(--c-surf)" stroke-width="2" stroke-linejoin="round"/>${dots}
  <text x="${P}" y="${H-8}" font-size="10" fill="var(--text3)">${shortK(pts[0].date)}/${pts[0].date.slice(2,4)}</text><text x="${W-12}" y="${H-8}" font-size="10" fill="var(--text3)" text-anchor="end">${shortK(pts[pts.length-1].date)}/${pts[pts.length-1].date.slice(2,4)}</text></svg>
  <p class="note">${norm?'Bande verte = '+(b.k==='vitd'?'zone visée':'norme du laboratoire')+'. ':''}Dernière valeur : <b>${nf(pts[pts.length-1][b.k],b.dec)} ${b.u}</b> le ${shortK(pts[pts.length-1].date)}/${pts[pts.length-1].date.slice(0,4)}. C'est la tendance qui compte, pas une valeur isolée.</p>`;
}
function bioHTML(){
  const th=[...data.thyro].sort((a,c)=>a.date<c.date?1:-1);
  const view=BIO.find(b=>b.k===data.bioView&&!b.noChart)||BIO[0];
  const fmtV=(x,b)=>{if(x[b.k]==null)return '';let v=b.n+' '+nf(x[b.k],b.dec);const n=bioNorm(x,b);if(b.k==='tpo'&&n)v+=' (norme < '+nf(n[1],1)+')';return v;};
  return `<div class="card"><div class="ct">Thyroïde & bilans sanguins</div>
   <div class="quota" style="margin-top:0">${BIO.filter(b=>!b.noChart).map(b=>`<span style="cursor:pointer;${b===view?'background:var(--text);color:var(--bg)':''}" onclick="data.bioView='${b.k}';save();renderBody()">${b.n}</span>`).join('')}</div>
   ${bioChart(view)}
   <div class="fg mt"><label class="fl">Traitement et compléments</label><input type="text" placeholder="ex. pas de traitement thyroïdien ; sélénium, vitamine D…" value="${esc(data.levo)}" onchange="data.levo=this.value;save()"></div>
   ${th.length?th.map(x=>`<div class="hist"><div class="dt">${shortK(x.date)}<br>${x.date.slice(0,4)}</div><div class="body"><div class="k" style="font-weight:700;font-size:13px">${BIO.map(b=>fmtV(x,b)).filter(Boolean).join(' · ')}</div>${x.note?`<div class="i">${esc(x.note)}</div>`:''}</div><button class="del" onclick="delThyro('${x.date}')">×</button></div>`).join(''):'<p class="note mb">Ajoute tes résultats de prise de sang, ou importe le fichier de tes bilans depuis Réglages.</p>'}
   <details class="acc" style="margin-top:6px"><summary>Ajouter un bilan</summary><div style="padding-bottom:12px">
   <div class="row"><div class="fg"><label class="fl">Date</label><input type="date" id="th-date" value="${dk(new Date())}"></div><div class="fg"><label class="fl">TSH (mUI/L)</label><input type="number" inputmode="decimal" step="0.01" id="th-tsh"></div></div>
   <div class="row"><div class="fg"><label class="fl">T4 libre (pmol/L)</label><input type="number" inputmode="decimal" step="0.01" id="th-t4"></div><div class="fg"><label class="fl">T3 libre (pmol/L)</label><input type="number" inputmode="decimal" step="0.01" id="th-t3"></div></div>
   <div class="row"><div class="fg"><label class="fl">Ferritine (µg/L)</label><input type="number" inputmode="decimal" id="th-fer"></div><div class="fg"><label class="fl">Vitamine D (ng/mL)</label><input type="number" inputmode="decimal" step="0.1" id="th-vitd"></div></div>
   <div class="row"><div class="fg"><label class="fl">Anti-TPO (UI/mL)</label><input type="number" inputmode="decimal" step="0.1" id="th-tpo"></div><div class="fg"><label class="fl">Norme anti-TPO (&lt;)</label><input type="number" inputmode="decimal" step="0.1" id="th-tponorm" placeholder="ex. 13,8"></div></div>
   <div class="fg"><label class="fl">Note</label><input type="text" id="th-note" placeholder="Compléments en cours, fatigue, heure du prélèvement…"></div>
   <button class="btn btn-s" onclick="addThyro()">Ajouter ce bilan</button></div></details>
   <p class="note mt">Ces valeurs restent sur ton téléphone. L'appli n'interprète rien médicalement : elle t'aide à voir les tendances et à préparer tes rendez-vous.</p></div>`;
}
function addThyro(){
  const v=id=>{const x=document.getElementById(id).value;return x===''?null:parseFloat(String(x).replace(',','.'))};
  const e={date:document.getElementById('th-date').value||dk(new Date()),note:document.getElementById('th-note').value};
  ['tsh','t4','t3','fer','vitd','tpo'].forEach(k=>e[k]=v('th-'+k));
  const tn=v('th-tponorm');if(tn!=null)e.norms={tpo:[0,tn]};
  if(['tsh','t4','t3','fer','vitd','tpo'].every(k=>e[k]==null)){alert('Entre au moins une valeur.');return;}
  const old=data.thyro.find(x=>x.date===e.date);
  if(old){['tsh','t4','t3','fer','vitd','tpo'].forEach(k=>{if(e[k]==null)e[k]=old[k]??null});if(!e.note)e.note=old.note;if(!e.norms)e.norms=old.norms;}
  data.thyro=data.thyro.filter(x=>x.date!==e.date);data.thyro.push(e);save();renderBody();
}
function delThyro(d){if(!confirm('Supprimer ce bilan ?'))return;data.thyro=data.thyro.filter(x=>x.date!==d);save();renderBody();}

// ================= RÉGLAGES =================
function renderSettings(){
  let rows='';
  ['haut','bas','surf'].forEach(g=>{
    rows+=`<div class="ct" style="margin-top:14px;color:${TYPES[g].color}">${TYPES[g].name}</div>`;
    SESSIONS[g].forEach(id=>{const p=data.presc[id],e=EX[id];rows+=`<div class="hist" onclick="editPresc('${id}')" style="cursor:pointer"><div class="body"><div class="k">${esc(e.name)}</div><div class="i">${p.sets} × ${p.target} ${unitLbl(id)} · ${esc(e.levels[p.level])}</div></div><span style="color:var(--text3);font-weight:800">›</span></div>`;});
  });
  document.getElementById('settings-body').innerHTML=`
  <div class="card"><div class="ct">Installer sur l'iPhone</div><p class="note">Dans Safari : bouton Partager, puis <b>Sur l'écran d'accueil</b>. L'appli s'ouvre alors en plein écran, marche sans réseau, et tes données restent sur ton téléphone.</p></div>
  <div class="card"><div class="ct">Programme</div>
   <div class="fg"><label class="fl">Prénom</label><input type="text" value="${esc(data.name)}" onchange="data.name=this.value.trim();save()"></div>

   <label class="tog"><input type="checkbox" ${data.voice?'checked':''} onchange="data.voice=this.checked;save()"> Annonces vocales pendant les minuteurs</label>
   <button class="btn btn-s mt" onclick="data.template=JSON.parse(JSON.stringify(TEMPLATE));save();alert('Semaine type d\\'origine restaurée.')">Restaurer la semaine type d'origine</button></div>
  <div class="card"><div class="ct">Tes exercices · séries, reps, palier</div><p class="note">L'appli ajuste toute seule : +1 rep quand toutes les séries sont réussies, palier suivant en haut de la fourchette. Touche un exercice pour corriger à la main.</p>${rows}</div>
  <div class="card"><div class="ct">Sauvegarde</div><p class="note mb">Tes données sont sur ce téléphone uniquement. Exporte-les de temps en temps (et avant de changer de téléphone). « Importer » accepte aussi un fichier de bilans sanguins : il s'ajoute sans rien effacer.</p>
   <div class="row"><button class="btn btn-s" onclick="exportData()">Exporter</button><button class="btn btn-s" onclick="document.getElementById('imp').click()">Importer</button></div>
   <input type="file" id="imp" accept=".json,application/json" class="hidden" onchange="importData(this)">
   <button class="btn btn-d mt" onclick="resetData()">Tout effacer</button></div>
  <p class="note" style="text-align:center;margin:10px 0 0">Houle · fait avec amour${esc(nm(' pour '))}</p>`;
}
function editPresc(id){
  const p=data.presc[id],e=EX[id];
  openSheet(`<h2>${esc(e.name)}</h2><p class="note mb">Fourchette : ${e.min} à ${e.max} ${unitLbl(id)}</p>
  <div class="row"><div class="fg"><label class="fl">Séries</label><input type="number" inputmode="numeric" id="pe-sets" value="${p.sets}"></div><div class="fg"><label class="fl">Objectif ${unitLbl(id)}</label><input type="number" inputmode="numeric" id="pe-target" value="${p.target}"></div></div>
  <div class="fg"><label class="fl">Palier</label><select id="pe-level">${e.levels.map((l,i)=>`<option value="${i}" ${i===p.level?'selected':''}>${i+1}. ${esc(l)}</option>`).join('')}</select></div>
  <button class="btn btn-p" onclick="savePresc('${id}')">Enregistrer</button><button class="btn btn-s mt" onclick="closeSheet()">Annuler</button>`);
}
function savePresc(id){const p=data.presc[id];p.sets=Math.max(1,+document.getElementById('pe-sets').value||p.sets);p.target=Math.max(1,+document.getElementById('pe-target').value||p.target);p.level=+document.getElementById('pe-level').value;save();closeSheet();renderSettings();}
function exportData(){
  const blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='houle-marie-'+dk(new Date())+'.json';document.body.appendChild(a);a.click();a.remove();
}
function importData(inp){
  const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);
    if(d.kind==='houle-bilans'){
      const dates=new Set(d.thyro.map(x=>x.date));data.thyro=data.thyro.filter(x=>!dates.has(x.date)).concat(d.thyro);
      if(d.levo&&!data.levo)data.levo=d.levo;if(d.nutri)Object.keys(d.nutri).forEach(k=>{if(data.nutri[k]==null)data.nutri[k]=d.nutri[k]});
      save();alert(d.thyro.length+' bilans importés.');showScreen('body');return;
    }
    if(!d.sessions||!d.presc)throw 0;if(!confirm('Remplacer les données actuelles par cette sauvegarde ?'))return;localStorage.setItem('houle-marie',JSON.stringify(d));data=load();alert('Sauvegarde importée.');showScreen('week');}catch(e){alert('Fichier non reconnu.');}};
  r.readAsText(f);
}
function resetData(){if(!confirm('Effacer toutes les séances, mesures et progrès ?'))return;if(!confirm('Vraiment tout ? Pense à exporter avant.'))return;localStorage.removeItem('houle-marie');data=load();showScreen('week');}

// ================= CONFETTIS =================
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=document.getElementById('confetti'),x=c.getContext('2d');c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.scale(devicePixelRatio,devicePixelRatio);
  const cols=['#E2583E','#16857F','#E39A26','#8466D0','#2B74BE','#1BA3B8'];
  const ps=[...Array(120)].map(()=>({x:innerWidth/2+(Math.random()-.5)*80,y:innerHeight*.35,vx:(Math.random()-.5)*12,vy:-Math.random()*13-4,s:Math.random()*7+4,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*cols.length)]}));
  let f=0;(function step(){x.clearRect(0,0,innerWidth,innerHeight);ps.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore();});if(++f<140)requestAnimationFrame(step);else x.clearRect(0,0,innerWidth,innerHeight);})();
}
